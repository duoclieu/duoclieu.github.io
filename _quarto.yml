project:
  type: website
  output-dir: docs
  preview:
    port: 4000
    browser: false
execute:
  freeze: auto
website:
  title: "Cơ sở dược liệu"
  description: "Đây là cơ sở dữ liệu về dược liệu."
  favicon: "Images/logo.png"
  site-url: 'https://duoclieu.github.io'
  repo-url: 'https://github.com/DuocLieu/duoclieu.github.io'
  repo-branch: main
  repo-actions: [edit, source, issue]
  reader-mode: true
  twitter-card: true
  page-navigation: true
  open-graph: true
  search: 
    location: navbar
    type: overlay
  page-footer:
    background: light
    left: 
      - text: "Về tôi"
        href: about.qmd
    right: 
      - text: "Cơ sở dữ liệu dược liệu"  
  navbar:
    logo: "Images/logo.png"
    background: primary
    search: true
    title: false
    right:
      - text: "Trang chủ"
        href: index.qmd
      - text: "Dược liệu"
        href: Pharmacognosy/index.qmd
      - text: "Dược dân tộc học"
        href: Ethnopharmacology/index.qmd
      - text: "Dược cổ truyền"
        href: Herbal Medicine/index.qmd      
      - text: "Blog"
        href: blog/index.qmd  
      - text: "Tìm kiếm"
        href: search.qmd        
      - text: "Về chúng tôi"
        menu:
          - text: "Về tôi"
            href: about.qmd 
          - text: "Về dự án"
            href: blog/posts/Post1.qmd
          - text: "CSDL"
            href: blog/posts/Post0.qmd            
           
      - icon: github
        href: https://github.com/DuocLieu/duoclieu.github.io
        aria-label: Github
  sidebar: 
    search: true
    style: docked
    contents: auto


#adsense:
#  publisher-id: ca-pub-1440105407870599

format: 
  html: 
    theme: 
      light: [flatly, scss/light.scss]
      dark: [darkly, scss/dark.scss]
    toc: true
    linestretch: 1.5
    css: scss/styles.css
    code-link: true
    link-external-icon: true
    link-external-newwindow: true
    smooth-scroll: true
    highlight-style: gruvbox
    df-print: kable
    comments:
      giscus:
        repo: duoclieu/duoclieu.github.io
        category: "General"
        mapping: "pathname"
        reactions-enabled: true
        loading: lazy
        input-position: "bottom"
        theme:
          light: light_high_contrast
          dark: dark_dimmed
